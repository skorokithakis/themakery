<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Makery</title>

    <link rel="icon" type="image/png" href="/static/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="The Makery" />
    <link rel="manifest" href="/static/images/favicon/site.webmanifest" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #3d3d3d;
            background: linear-gradient(135deg, #d8d4c4 0%, #cec9b8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: #f4f1e2;
            padding: 50px 45px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(74, 139, 139, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.4em;
            margin-bottom: 8px;
            color: #4a6b6b;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 1.1em;
            color: #8b7b7b;
            margin-bottom: 36px;
        }

        .listmonk-form h3 {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #5a7b7b;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .listmonk-form p {
            margin-bottom: 15px;
        }

        .listmonk-form input[type="email"],
        .listmonk-form input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #ddd9ca;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            background: #fffdf5;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .listmonk-form input[type="email"]:focus,
        .listmonk-form input[type="text"]:focus {
            outline: none;
            border-color: #4a8b8b;
            box-shadow: 0 0 0 3px rgba(74, 139, 139, 0.15);
        }

        .listmonk-form input[type="checkbox"] {
            margin-right: 8px;
        }

        .listmonk-form label {
            font-weight: 500;
            color: #4a6b6b;
        }

        .listmonk-form span {
            display: block;
            margin-left: 24px;
            margin-top: 5px;
            font-size: 0.9em;
            color: #8b7b7b;
        }

        .listmonk-form input[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e07b54 0%, #d96a43 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .listmonk-form input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(224, 123, 84, 0.4);
        }

        .listmonk-form input[type="submit"]:active {
            transform: translateY(0);
        }

        .listmonk-form input[type="submit"]:disabled {
            background: #c4b5a5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }

        .message.success {
            background: #e8f5e8;
            color: #2d5a2d;
            border: 1px solid #c8e6c8;
            display: block;
        }

        .message.error {
            background: #fdeaea;
            color: #8b3a3a;
            border: 1px solid #f5c6c6;
            display: block;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/images/favicon/favicon.svg" alt="The Makery logo" class="logo">
        <h1>The Makery</h1>
        <p class="tagline">Just makin' things.</p>

        <div id="message" class="message"></div>

        <form method="post" action="https://listmonk.home.stavros.io/subscription/form" class="listmonk-form" id="subscription-form">
            <div>
                <h3>Subscribe to our newsletter</h3>
                <p>Every so often, we send a newsletter with links to all the general maker interest projects and sites that we discussed on the server this week. Subscribe to receive it.</p>
                <input type="hidden" name="nonce" />
                <input type="hidden" name="l" value="9d008ac8-09f9-4bee-a887-c80485a901ca" />

                <p><input type="email" name="email" id="email" required placeholder="E-mail" /></p>

                <input type="submit" value="Subscribe" id="submit-button" />
            </div>
        </form>
    </div>

    <script>
        document.getElementById('subscription-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const form = event.target;
            const submitButton = document.getElementById('submit-button');
            const messageElement = document.getElementById('message');
            const emailInput = document.getElementById('email');

            submitButton.disabled = true;
            submitButton.value = 'Subscribing...';
            messageElement.className = 'message';
            messageElement.textContent = '';

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    messageElement.className = 'message success';
                    messageElement.textContent = 'Successfully subscribed! Check your email to confirm your subscription.';
                    emailInput.value = '';
                    form.classList.add('hidden');
                } else {
                    throw new Error('Subscription failed');
                }
            } catch (error) {
                messageElement.className = 'message error';
                messageElement.textContent = 'Something went wrong. Please try again later.';
                submitButton.disabled = false;
                submitButton.value = 'Subscribe';
            }
        });
    </script>
</body>
</html>
